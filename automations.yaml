- id: '1788682241755'
  alias: Garage Kühlschrank - Zeitsteuerung
  description: 'Schaltet den Kühlschrank zwischen 09:00 und 20:00 Uhr ein. Außerhalb
    dieses Zeitfensters wird er ausgeschaltet, sobald die Leistungsaufnahme höchstens
    5 W beträgt. Ereignisgesteuert ohne 5-Minuten-Abfrage.

    '
  triggers:
  - trigger: time
    at: 09:00:00
    id: einschalten
  - trigger: time
    at: '20:00:00'
    id: zeit_ende
  - trigger: numeric_state
    entity_id: sensor.nous3_kuhlschrank_garage_energy_power
    below: 5.01
    id: leistung_niedrig
  - trigger: homeassistant
    event: start
    id: ha_start
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: einschalten
      - condition: state
        entity_id: switch.nous3_kuhlschrank_garage_nous3
        state: 'off'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.nous3_kuhlschrank_garage_nous3
      - action: telegram_bot.send_message
        data:
          chat_id:
          - 173339841
          message: Kühlschrank in der Garage wurde eingeschaltet!
    - conditions:
      - condition: trigger
        id:
        - zeit_ende
        - leistung_niedrig
      - condition: or
        conditions:
        - condition: time
          after: '20:00:00'
        - condition: time
          before: 09:00:00
      - condition: state
        entity_id: switch.nous3_kuhlschrank_garage_nous3
        state: 'on'
      - condition: numeric_state
        entity_id: sensor.nous3_kuhlschrank_garage_energy_power
        below: 5.01
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.nous3_kuhlschrank_garage_nous3
      - action: telegram_bot.send_message
        data:
          chat_id:
          - 173339841
          message: Kühlschrank in der Garage wurde ausgeschaltet!
    - conditions:
      - condition: trigger
        id: ha_start
      sequence:
      - choose:
        - conditions:
          - condition: time
            after: 09:00:00
            before: '20:00:00'
          - condition: state
            entity_id: switch.nous3_kuhlschrank_garage_nous3
            state: 'off'
          sequence:
          - action: switch.turn_on
            target:
              entity_id: switch.nous3_kuhlschrank_garage_nous3
          - action: telegram_bot.send_message
            data:
              chat_id:
              - 173339841
              message: Kühlschrank in der Garage wurde eingeschaltet!
        - conditions:
          - condition: or
            conditions:
            - condition: time
              after: '20:00:00'
            - condition: time
              before: 09:00:00
          - condition: state
            entity_id: switch.nous3_kuhlschrank_garage_nous3
            state: 'on'
          - condition: numeric_state
            entity_id: sensor.nous3_kuhlschrank_garage_energy_power
            below: 5.01
          sequence:
          - action: switch.turn_off
            target:
              entity_id: switch.nous3_kuhlschrank_garage_nous3
          - action: telegram_bot.send_message
            data:
              chat_id:
              - 173339841
              message: Kühlschrank in der Garage wurde ausgeschaltet!
  mode: single
- id: '1788719588508'
  alias: Dachboden Entfeuchter nach Feuchte Temperatur Zeit
  description: 'Steuert den Luftentfeuchter auf dem Dachboden abhängig von Luftfeuchtigkeit,
    Außentemperatur und Uhrzeit. Ereignisgesteuert ohne minütliche Abfrage.

    '
  triggers:
  - trigger: numeric_state
    entity_id: sensor.thermodachboden_humidity
    above: 68
    id: feuchte_hoch
  - trigger: numeric_state
    entity_id: sensor.thermodachboden_humidity
    below: 64
    id: feuchte_niedrig
  - trigger: numeric_state
    entity_id: sensor.gw1200a_outdoor_temperature
    above: 2
    id: temperatur_ok
  - trigger: numeric_state
    entity_id: sensor.gw1200a_outdoor_temperature
    below: 2.01
    id: temperatur_kalt
  - trigger: time
    at: 09:00:00
    id: startzeit
  - trigger: time
    at: '17:00:00'
    id: endzeit
  - trigger: numeric_state
    entity_id: sensor.gosund_1_entfeuchter_dach_energy_power
    below: 100
    id: leistung_niedrig
  - trigger: state
    entity_id: switch.gosund_1_entfeuchter_dach_gosund_1
    from: 'off'
    to: 'on'
    id: eingeschaltet
  - trigger: homeassistant
    event: start
    id: start
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: endzeit
        - condition: trigger
          id: leistung_niedrig
        - condition: trigger
          id: eingeschaltet
        - condition: trigger
          id: start
      - condition: or
        conditions:
        - condition: time
          before: 09:00:00
        - condition: time
          after: '17:00:00'
      - condition: state
        entity_id: switch.gosund_1_entfeuchter_dach_gosund_1
        state: 'on'
      - condition: numeric_state
        entity_id: sensor.gosund_1_entfeuchter_dach_energy_power
        below: 100
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.gosund_1_entfeuchter_dach_gosund_1
    - conditions:
      - condition: trigger
        id:
        - temperatur_kalt
        - startzeit
        - start
      - condition: time
        after: 09:00:00
        before: '17:00:00'
      - condition: numeric_state
        entity_id: sensor.gw1200a_outdoor_temperature
        below: 2.01
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.gosund_1_entfeuchter_dach_gosund_1
    - conditions:
      - condition: trigger
        id:
        - feuchte_niedrig
        - startzeit
        - start
      - condition: time
        after: 09:00:00
        before: '17:00:00'
      - condition: numeric_state
        entity_id: sensor.thermodachboden_humidity
        below: 64
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.gosund_1_entfeuchter_dach_gosund_1
    - conditions:
      - condition: trigger
        id:
        - feuchte_hoch
        - temperatur_ok
        - startzeit
        - start
      - condition: time
        after: 09:00:00
        before: '17:00:00'
      - condition: numeric_state
        entity_id: sensor.gw1200a_outdoor_temperature
        above: 2
      - condition: numeric_state
        entity_id: sensor.thermodachboden_humidity
        above: 68
      - condition: state
        entity_id: switch.gosund_1_entfeuchter_dach_gosund_1
        state: 'off'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.gosund_1_entfeuchter_dach_gosund_1
  mode: single
- id: '1788719611744'
  alias: Dachboden Ventilator - Intervallbetrieb
  description: 'Schaltet den Ventilator zwischen 09:00 und 17:59 Uhr zweimal pro Stunde
    für jeweils vier Minuten ein.

    '
  triggers:
  - trigger: time_pattern
    minutes: '0'
    seconds: '0'
    id: einschalten
  - trigger: time_pattern
    minutes: '30'
    seconds: '0'
    id: einschalten
  - trigger: time_pattern
    minutes: '4'
    seconds: '0'
    id: ausschalten
  - trigger: time_pattern
    minutes: '34'
    seconds: '0'
    id: ausschalten
  - trigger: homeassistant
    event: start
    id: start
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: einschalten
      - condition: time
        after: 08:59:59
        before: '18:00:00'
      - condition: state
        entity_id: switch.gosund_3_ventilator_dachboden_gosund_3
        state: 'off'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.gosund_3_ventilator_dachboden_gosund_3
    - conditions:
      - condition: trigger
        id: ausschalten
      - condition: state
        entity_id: switch.gosund_3_ventilator_dachboden_gosund_3
        state: 'on'
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.gosund_3_ventilator_dachboden_gosund_3
    - conditions:
      - condition: trigger
        id: start
      sequence:
      - choose:
        - conditions:
          - condition: time
            after: 08:59:59
            before: '18:00:00'
          - condition: template
            value_template: '{% set m = now().minute %} {{ (0 <= m < 4) or (30 <=
              m < 34) }}

              '
          sequence:
          - action: switch.turn_on
            target:
              entity_id: switch.gosund_3_ventilator_dachboden_gosund_3
        default:
        - action: switch.turn_off
          target:
            entity_id: switch.gosund_3_ventilator_dachboden_gosund_3
  mode: single
- id: '1788722497377'
  alias: Regenwasserpumpe - Laufzeitalarm
