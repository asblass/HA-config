- id: '1788769726696'
  alias: Waschküche - Entfeuchter und Lüfter Steuerung
  description: 'Hauptsteuerung für Entfeuchter und Lüfter in der Waschküche. Fenster
    offen: Lüfter an und Entfeuchter aus. Fenster geschlossen: Lüfter nur bei aktivem
    manuellen Timer. Entfeuchter wird zwischen 09:30 und 20:00 Uhr oder während des
    manuellen 3-Stunden-Betriebs nach Luftfeuchtigkeit geregelt. Ereignisgesteuert
    ohne Trigger bei jedem Feuchte-Update.

    '
  triggers:
  - trigger: state
    entity_id: binary_sensor.keller_waschkuche_fenster_kontakt
    from: 'off'
    to: 'on'
    id: fenster_offen
  - trigger: state
    entity_id: binary_sensor.keller_waschkuche_fenster_kontakt
    from: 'on'
    to: 'off'
    id: fenster_geschlossen
  - trigger: numeric_state
    entity_id: sensor.feuchte_waschkueche_am2301_humidity
    above: 54.9
    id: feuchte_hoch
  - trigger: numeric_state
    entity_id: sensor.feuchte_waschkueche_am2301_humidity
    below: 50.1
    id: feuchte_niedrig
  - trigger: state
    entity_id: timer.lufter_waschkuche_manuell
    id: luefter_timer
  - trigger: state
    entity_id: input_boolean.entfeuchter_waschkueche_manuell
    id: entfeuchter_manuell
  - trigger: time
    at: input_datetime.entfeuchter_waschkueche_manuell_ende
    id: entfeuchter_manuell_ende
  - trigger: time
    at: 09:30:00
    id: zeit_start
  - trigger: time
    at: '20:00:00'
    id: zeit_ende
  - trigger: homeassistant
    event: start
    id: ha_start
  conditions: []
  actions:
  - if:
    - condition: trigger
      id:
      - fenster_offen
      - fenster_geschlossen
    then:
    - action: timer.cancel
      target:
        entity_id: timer.lufter_waschkuche_manuell
  - if:
    - condition: state
      entity_id: binary_sensor.keller_waschkuche_fenster_kontakt
      state: 'on'
    then:
    - if:
      - condition: state
        entity_id: switch.nous_4_ventilator_waschkuche
        state: 'off'
      then:
      - action: switch.turn_on
        target:
          entity_id: switch.nous_4_ventilator_waschkuche
    - if:
      - condition: state
        entity_id: switch.waschkucher_steckdoseentfeuchter
        state: 'on'
      then:
      - action: switch.turn_off
        target:
          entity_id: switch.waschkucher_steckdoseentfeuchter
    - stop: 'Fenster offen: Lüfter an, Entfeuchter aus'
  - if:
    - condition: state
      entity_id: timer.lufter_waschkuche_manuell
      state: active
    then:
    - if:
      - condition: state
        entity_id: switch.nous_4_ventilator_waschkuche
        state: 'off'
      then:
      - action: switch.turn_on
        target:
          entity_id: switch.nous_4_ventilator_waschkuche
    else:
    - if:
      - condition: state
        entity_id: switch.nous_4_ventilator_waschkuche
        state: 'on'
      then:
      - action: switch.turn_off
        target:
          entity_id: switch.nous_4_ventilator_waschkuche
  - choose:
    - conditions:
      - condition: or
        conditions:
        - condition: time
          after: 09:29:59
          before: '20:00:00'
        - condition: and
          conditions:
          - condition: state
            entity_id: input_boolean.entfeuchter_waschkueche_manuell
            state: 'on'
          - condition: template
            value_template: "{{\n  as_timestamp(\n    states('input_datetime.entfeuchter_waschkueche_manuell_ende'),\n
              \   0\n  ) > as_timestamp(now())\n}}\n"
      sequence:
      - condition: template
        value_template: "{{\n  is_number(\n    states('sensor.feuchte_waschkueche_am2301_humidity')\n
          \ )\n}}\n"
      - choose:
        - conditions:
          - condition: numeric_state
            entity_id: sensor.feuchte_waschkueche_am2301_humidity
            above: 54.9
          - condition: state
            entity_id: switch.waschkucher_steckdoseentfeuchter
            state: 'off'
          sequence:
          - action: switch.turn_on
            target:
              entity_id: switch.waschkucher_steckdoseentfeuchter
        - conditions:
          - condition: numeric_state
            entity_id: sensor.feuchte_waschkueche_am2301_humidity
            below: 50.1
          - condition: state
            entity_id: switch.waschkucher_steckdoseentfeuchter
            state: 'on'
          sequence:
          - action: switch.turn_off
            target:
              entity_id: switch.waschkucher_steckdoseentfeuchter
    default:
    - if:
      - condition: state
        entity_id: switch.waschkucher_steckdoseentfeuchter
        state: 'on'
      then:
      - action: switch.turn_off
        target:
          entity_id: switch.waschkucher_steckdoseentfeuchter
  mode: restart
- id: '1788769844488'
  alias: Waschküche - Lüfter Taster
  description: 'Ein Tastendruck schaltet den Lüfter bei geschlossenem Fenster für
    eine Stunde ein. Erneuter Tastendruck beendet den manuellen Betrieb.

    '
  triggers:
  - trigger: state
    entity_id: event.tasterluefter_action
  conditions:
  - condition: template
    value_template: '{{ trigger.to_state.attributes.event_type == ''single'' }}

      '
  actions:
  - if:
    - condition: state
      entity_id: binary_sensor.keller_waschkuche_fenster_kontakt
      state: 'on'
    then:
    - stop: Fenster ist offen
  - choose:
    - conditions:
      - condition: state
        entity_id: switch.nous_4_ventilator_waschkuche
        state: 'on'
      sequence:
      - action: timer.cancel
        target:
          entity_id: timer.luefter_waschkueche_manuell
      - action: switch.turn_off
        target:
          entity_id: switch.nous_4_ventilator_waschkuche
    default:
    - action: timer.start
      target:
        entity_id: timer.luefter_waschkueche_manuell
      data:
        duration: 01:00:00
    - action: switch.turn_on
      target:
        entity_id: switch.nous_4_ventilator_waschkuche
  mode: restart
- id: '1788771007498'
  alias: Waschküche - Entfeuchter manueller Betrieb
  description: 'Verwaltet die dreistündige manuelle Freigabe des Entfeuchters einschließlich
    persistenter Endzeit.

    '
  triggers:
  - trigger: state
    entity_id:
    - input_boolean.entfeuchter_waschkuche_manuell
    to:
    - 'on'
    id: eingeschaltet
  - trigger: state
    entity_id:
    - input_boolean.entfeuchter_waschkuche_manuell
    to:
    - 'off'
    id: ausgeschaltet
  - trigger: time
    at: input_datetime.entfeuchter_waschkueche_manuell_ende
    id: abgelaufen
  - trigger: homeassistant
    event: start
    id: ha_start
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: eingeschaltet
      sequence:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.entfeuchter_waschkueche_manuell_ende
        data:
          timestamp: '{{ (now() + timedelta(hours=3)).timestamp() }}

            '
    - conditions:
      - condition: trigger
        id: abgelaufen
      - condition: state
        entity_id: input_boolean.entfeuchter_waschkueche_manuell
        state: 'on'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.entfeuchter_waschkueche_manuell
    - conditions:
      - condition: trigger
        id: ha_start
      - condition: state
        entity_id: input_boolean.entfeuchter_waschkueche_manuell
        state: 'on'
      - condition: template
        value_template: "{{\n  as_timestamp(\n    states('input_datetime.entfeuchter_waschkueche_manuell_ende'),\n
          \   0\n  ) <= as_timestamp(now())\n}}\n"
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.entfeuchter_waschkueche_manuell
  mode: restart
