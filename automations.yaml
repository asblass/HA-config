- id: '1788804582666'
  alias: Stehlampe Wohnzimmer - Dämmerungsautomatik
  description: 'Schaltet die Wohnzimmer-Stehlampe bei Dunkelheit automatisch ein.
    Manuell eingeschaltete Lampen werden bei steigender Helligkeit nicht automatisch
    ausgeschaltet. Die abendliche Ausschaltzeit variiert zufällig zwischen 22:55 und
    23:15 Uhr.

    '
  triggers:
  - trigger: numeric_state
    entity_id: sensor.wettersensor_smart_brightness
    below: 481
    id: dunkel
  - trigger: numeric_state
    entity_id: sensor.wettersensor_smart_brightness
    above: 680
    id: hell
  - trigger: time_pattern
    minutes: /2
    id: pruefen
  - trigger: time
    at: '15:00:00'
    id: start
  - trigger: time
    at: '22:55:00'
    id: nacht
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: nacht
      sequence:
      - delay:
          seconds: '{{ range(0, 1201) | random }}'
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.stehlampe_wohnzimmer_automatik_aktiv
      - action: light.turn_off
        target:
          entity_id: light.fernsehecke_stehlampe
    - conditions:
      - condition: trigger
        id:
        - dunkel
        - pruefen
        - start
      - condition: time
        after: '15:00:00'
        before: '23:00:00'
      - condition: numeric_state
        entity_id: sensor.wettersensor_smart_brightness
        below: 481
      - condition: state
        entity_id: light.fernsehecke_stehlampe
        state: 'off'
      - condition: state
        entity_id: input_boolean.stehlampe_wohnzimmer_automatik_aktiv
        state: 'off'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.fernsehecke_stehlampe
        data:
          brightness_pct: 85
      - delay:
          seconds: 1
      - if:
        - condition: state
          entity_id: light.fernsehecke_stehlampe
          state: 'on'
        then:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.stehlampe_wohnzimmer_automatik_aktiv
    - conditions:
      - condition: trigger
        id:
        - hell
        - pruefen
      - condition: time
        after: '15:00:00'
        before: '23:00:00'
      - condition: numeric_state
        entity_id: sensor.wettersensor_smart_brightness
        above: 680
      - condition: state
        entity_id: input_boolean.stehlampe_wohnzimmer_automatik_aktiv
        state: 'on'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.stehlampe_wohnzimmer_automatik_aktiv
      - action: light.turn_off
        target:
          entity_id: light.fernsehecke_stehlampe
  mode: single
- id: '1788805413550'
  alias: Stehlampe Flur OG - Helligkeitsautomatik
  description: 'Steuert light.empore_flur anhand der Außenhelligkeit. EIN bei <= 60
    Lux mit 90 % Helligkeit. AUS bei >= 100 Lux. Manuelles Ausschalten während einer
    automatischen Dunkelphase sperrt das Wiedereinschalten bis zur nächsten Hellphase.
    Abends wird die Lampe zufällig zwischen 22:05 und 22:15 Uhr ausgeschaltet.

    '
  triggers:
  - trigger: numeric_state
    entity_id: sensor.wettersensor_smart_brightness
    below: 61
    id: dunkel
  - trigger: numeric_state
    entity_id: sensor.wettersensor_smart_brightness
    above: 99
    id: hell
  - trigger: time
    at: '15:00:00'
    id: tagesreset
  - trigger: time
    at: '22:05:00'
    id: abend
  - trigger: state
    entity_id: light.empore_flur
    from: 'on'
    to: 'off'
    id: lampe_aus
  - trigger: homeassistant
    event: start
    id: start
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: tagesreset
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.stehlampe_flur_og_manuelle_sperre
      - if:
        - condition: numeric_state
          entity_id: sensor.wettersensor_smart_brightness
          below: 61
        - condition: state
          entity_id: light.empore_flur
          state: 'off'
        then:
        - action: light.turn_on
          target:
            entity_id: light.empore_flur
          data:
            brightness_pct: 90
            transition: 0.1
    - conditions:
      - condition: trigger
        id: dunkel
      - condition: time
        after: '15:00:00'
        before: '22:00:00'
      - condition: state
        entity_id: light.empore_flur
        state: 'off'
      - condition: state
        entity_id: input_boolean.stehlampe_flur_og_manuelle_sperre
        state: 'off'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.empore_flur
        data:
          brightness_pct: 90
          transition: 0.1
    - conditions:
      - condition: trigger
        id: hell
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.stehlampe_flur_og_manuelle_sperre
      - if:
        - condition: time
          after: '15:00:00'
          before: '22:00:00'
        - condition: state
          entity_id: light.empore_flur
          state: 'on'
        then:
        - action: light.turn_off
          target:
            entity_id: light.empore_flur
          data:
            transition: 0.5
    - conditions:
      - condition: trigger
        id: lampe_aus
      - condition: time
        after: '15:00:00'
        before: '22:00:00'
      - condition: numeric_state
        entity_id: sensor.wettersensor_smart_brightness
        below: 61
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.stehlampe_flur_og_manuelle_sperre
    - conditions:
      - condition: trigger
        id: start
      - condition: time
        after: '15:00:00'
        before: '22:00:00'
      - condition: numeric_state
        entity_id: sensor.wettersensor_smart_brightness
        below: 61
      - condition: state
        entity_id: light.empore_flur
        state: 'off'
      - condition: state
        entity_id: input_boolean.stehlampe_flur_og_manuelle_sperre
        state: 'off'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.empore_flur
        data:
          brightness_pct: 90
          transition: 0.1
    - conditions:
      - condition: trigger
        id: abend
      sequence:
      - delay:
          seconds: '{{ range(0, 601) | random }}'
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.stehlampe_flur_og_manuelle_sperre
      - action: light.turn_off
        target:
          entity_id: light.empore_flur
        data:
          transition: 0.5
  mode: parallel
  max: 10
