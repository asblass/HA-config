- id: '1788649508126'
  alias: Bosch Gefrierschrank - Leistungsüberwachung
  description: 'Alarmiert, wenn der Gefrierschrank länger als 180 Minuten über 25
    W oder länger als 180 Minuten unter 15 W liegt.

    '
  triggers:
  - trigger: numeric_state
    entity_id: sensor.nous2_bosch_gefrierschrank_energy_power
    above: 25
    for:
      hours: 3
    id: laeuft_zu_lange
  - trigger: numeric_state
    entity_id: sensor.nous2_bosch_gefrierschrank_energy_power
    below: 15
    for:
      hours: 3
    id: laeuft_nicht
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: laeuft_zu_lange
      sequence:
      - action: telegram_bot.send_message
        data:
          message: Bosch Eisschrank läuft seit 180 Minuten dauerhaft mit mehr als
            25 W! Bitte prüfen, ob die Tür richtig geschlossen ist!
          chat_id:
          - 173339841
          - 770182243
      - action: notify.pushover
        data:
          message: Bosch Eisschrank läuft seit 180 Minuten dauerhaft mit mehr als
            25 W! Bitte prüfen, ob die Tür richtig geschlossen ist!
          data:
            sound: magic
            priority: 1
    - conditions:
      - condition: trigger
        id: laeuft_nicht
      sequence:
      - action: telegram_bot.send_message
        data:
          message: Bosch Eisschrank läuft seit 180 Minuten nicht! Stromversorgung
            prüfen!
          chat_id:
          - 173339841
          - 770182243
      - action: notify.pushover
        data:
          message: Bosch Eisschrank läuft seit 180 Minuten nicht! Stromversorgung
            prüfen!
          data:
            sound: magic
            priority: 1
  mode: single
